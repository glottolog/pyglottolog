[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyglottolog"
version = "5.0.0"
description = "Python package for Glottolog data curation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Robert Forkel", email = "dlce.rdm@eva.mpg.de"}
]
keywords = ["linguistics", "glottolog"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "simplepybtex",
    "clldutils>=4.0",
    "cldfcatalog",
    "csvw>=4.0",
    "pycldf>=2.0",
    "cldfzenodo>=3.0",
    "sqlalchemy>=2.1",
    "tqdm",
    "latexcodec",
    "unidecode",
    "pycountry>=18.12.8",
    "termcolor",
    "newick>=0.9.2",
    "markdown",
    "requests",
    "nameparser>=2.8",
    "linglit>=0.3",
    "packaging",
]

[project.urls]
Homepage = "https://github.com/glottolog/pyglottolog"

[project.optional-dependencies]
geo = [
    "shapely",
    "pyproj",
]
dev = [
    "tox",
    "ruff",
    "wheel>=0.36",
    "twine",
    "build",
]
test = [
    "pytest>=5",
    "pytest-mock",
    "requests-mock",
    "pytest-cov",
    "coverage>=4.2",
    "shapely",
    "pyproj",
    "python-levenshtein",
]
docs = [
    "sphinx<7",
    "sphinx-autodoc-typehints",
    "sphinx-rtd-theme",
]

[project.scripts]
glottolog = "pyglottolog.__main__:main"
glottolog-admin = "pyglottolog.__main__:admin_main"

[tool.setuptools]
zip-safe = false
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyglottolog = [
    "config/*.ini",
    "data/*",
    "templates/**/*",
]

[tool.ruff]
line-length = 100
exclude = [".tox"]

[tool.ruff.lint]
select = ["UP", "N", "C90", "PL", "E", "F"]
ignore = [
    "UP031",
    "PLW2901",
    "PLR2004",
]

[tool.pytest.ini_options]
minversion = "5.0"
testpaths = ["tests"]
addopts = [
    "--cov",
    "--doctest-modules",
]
filterwarnings = [
    "default::sqlalchemy.exc.LegacyAPIWarning",
    "default::sqlalchemy.exc.SAWarning",
]

[tool.coverage.run]
source = [
    "pyglottolog",
    "tests",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.tox]
requires = ["tox>=4.19"]
env_list = ["py311", "py312", "py313", "py314", "py315"]
skip_missing_interpreters = true

[tool.tox.env_run_base]
extras = ["test"]
commands = [["pytest", { replace = "posargs", default = [], extend = true }]]
